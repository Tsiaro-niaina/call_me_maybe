[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "torch",
    "llm_sdk",
]

[dependency-groups]
dev = ["flake8", "mypy", "pytest"]

[tool.uv]
package = false

[tool.uv.sources]
llm_sdk = { path = "llm_sdk" }
torch = { index = "pytorch-cpu" }


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
mypy_path = "llm_sdk"
exclude = ["llm_sdk", ".venv"]

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true