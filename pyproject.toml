[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "torch",
    "llm_sdk",
]

[dependency-groups]
dev = [
    "flake8",
    "flake8-docstrings",
    "flake8-pyproject",
    "mypy",
    "pytest",
]

[tool.uv]
package = false

[tool.uv.sources]
llm_sdk = { path = "llm_sdk" }
torch = { index = "pytorch-cpu" }


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
mypy_path = "llm_sdk"
exclude = ["llm_sdk", ".venv"]

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true

[tool.flake8]
max-line-length = 88

select = ["E", "F", "W", "C901", "D"]
exclude = [
    ".venv",
    "llm_sdk",
]

ignore = [
    "D100",
    "D104",
    "W503",
]